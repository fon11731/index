<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>给妈妈的惊喜</title>
    <style>
        /* 基础样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body,
        html {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            overflow: hidden;
        }

        /* 画布层（撒花用） */
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            /* 让点击穿透画布 */
        }

        /* 内容容器 */
        .container {
            position: relative;
            z-index: 10;
            /* 保证内容在画布上面 */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            text-align: center;
            padding: 20px;
        }

        /* 锁图标 */
        .lock-icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        /* 标题 */
        h1 {
            font-size: 28px;
            color: #ff4d4f;
            margin-bottom: 10px;
        }

        p {
            font-size: 16px;
            color: #888;
            margin-bottom: 20px;
        }

        /* 时间显示 */
        .time-display {
            font-family: 'Courier New', monospace;
            font-size: 24px;
            background: #333;
            padding: 10px 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        /* 解锁后的内容卡片 */
        .card {
            background: rgba(255, 255, 255, 0.95);
            color: #333;
            padding: 40px;
            border-radius: 20px;
            max-width: 90%;
            width: 400px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: none;
            /* 默认隐藏 */
            animation: slideUp 1s ease-out;
        }

        .card h2 {
            color: #ff4d4f;
            margin-bottom: 20px;
        }

        .card p {
            color: #555;
            line-height: 1.8;
        }

        /* 调试按钮 */
        .debug-btn {
            margin-top: 30px;
            padding: 8px 16px;
            background: #333;
            border: 1px solid #555;
            color: #777;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            opacity: 0.5;
            /* 半透明，不抢眼 */
            transition: opacity 0.3s;
        }

        .debug-btn:hover {
            opacity: 1;
        }

        /* 动画 */
        @keyframes bounce {

            0%,
            20%,
            50%,
            80%,
            100% {
                transform: translateY(0);
            }

            40% {
                transform: translateY(-20px);
            }

            60% {
                transform: translateY(-10px);
            }
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <!-- 撒花画布 -->
    <canvas id="canvas"></canvas>

    <div class="container">
        <!-- 锁定界面 -->
        <div id="lock-screen">
            <div class="lock-icon">🔒</div>
            <h1>未到时间</h1>
            <p>请在母亲节当天开启</p>
            <div class="time-display" id="clock">00:00:00</div>
            <p id="date-info">正在获取日期...</p>

            <!-- 修复后的调试按钮 -->
            <button class="debug-btn" onclick="forceUnlock()">🔧 强制解锁 (测试用)</button>
        </div>

        <!-- 解锁后的内容 -->
        <div id="content" class="card">
            <div class="lock-icon">💐</div>
            <h2>母亲节快乐！</h2>
            <p>亲爱的妈妈：</p>
            <p>时光慢些吧，不要再让您变老了。<br>愿岁月温柔待您，愿您永远健康、快乐。</p>
            <p style="text-align: right; margin-top: 20px;">—— 爱您的孩子</p>
        </div>
    </div>

    <script>
        // --- 1. 时间逻辑 ---
        function checkTime() {
            const now = new Date();

            // 更新时钟
            document.getElementById('clock').innerText = now.toLocaleTimeString('zh-CN', { hour12: false });

            // 获取日期信息
            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const date = now.getDate();
            const day = now.getDay(); // 0是周日

            document.getElementById('date-info').innerText = `今天是：${year}年${month}月${date}日`;

            // 判定母亲节 (5月的第二个星期日)
            let isMothersDay = false;
            if (month === 5) {
                if (day === 0 && date >= 8 && date <= 14) {
                    isMothersDay = true;
                }
            }

            // 控制显示
            if (isMothersDay) {
                unlockPage();
            }
        }

        // --- 2. 解锁功能 (修复了这里) ---
        function unlockPage() {
            document.getElementById('lock-screen').style.display = 'none';
            document.getElementById('content').style.display = 'block';
            startFireworks(); // 解锁时触发撒花
        }

        // --- 3. 强制解锁按钮 (绑定到了 unlockPage) ---
        function forceUnlock() {
            // 这里直接调用解锁函数，不再判断日期
            unlockPage();
        }

        // --- 4. 撒花特效逻辑 ---
        function startFireworks() {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            const colors = ['#ffb7b2', '#ffdac1', '#e2f0cb', '#b5ead7', '#c7ceea', '#ff9aa2'];

            function createParticle() {
                return {
                    x: Math.random() * canvas.width,
                    y: -20,
                    size: Math.random() * 10 + 5,
                    speedY: Math.random() * 2 + 1,
                    speedX: Math.random() * 2 - 1,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    rotation: Math.random() * 360,
                    rotationSpeed: Math.random() * 2 - 1
                };
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // 持续生成花瓣
                if (particles.length < 100) {
                    particles.push(createParticle());
                }

                for (let i = 0; i < particles.length; i++) {
                    const p = particles[i];
                    p.y += p.speedY;
                    p.x += p.speedX;
                    p.rotation += p.rotationSpeed;

                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rotation * Math.PI / 180);
                    ctx.fillStyle = p.color;

                    // 画爱心或圆形
                    ctx.beginPath();
                    if (i % 2 === 0) {
                        // 爱心
                        const r = p.size;
                        ctx.moveTo(0, 0);
                        ctx.bezierCurveTo(r / 2, -r / 2, r, 0, 0, r);
                        ctx.bezierCurveTo(-r, 0, -r / 2, -r / 2, 0, 0);
                    } else {
                        // 圆形
                        ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
                    }
                    ctx.fill();
                    ctx.restore();

                    // 重置落到底部的粒子
                    if (p.y > canvas.height) {
                        particles[i] = createParticle();
                    }
                }
                requestAnimationFrame(animate);
            }
            animate();
        }

        // 初始化
        setInterval(checkTime, 1000);
        checkTime(); // 立即执行一次
    </script>
</body>

</html>
